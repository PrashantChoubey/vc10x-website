<style>
:root{
  --paper:#FFFFFF; --panel:#F6F6F6; --ink:#000000; --muted:#5C5C5C; --line:#D9D9D9;
  --green:#000000; --green-soft:#F2F2F2; --brass:#3FDCFF; --flag:#C0392B; --flag-soft:#FBE9E7;
  --on-green:#FFFFFF;
  --serif:"Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --panel:#111111; --ink:#FFFFFF; --muted:#A6A6A6; --line:#2B2B2B;
  --green:#FFFFFF; --green-soft:#1C1C1C; --brass:#3FDCFF; --flag:#FF7A6B; --flag-soft:#3A1512;
  --on-green:#000000;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --panel:#111111; --ink:#FFFFFF; --muted:#A6A6A6; --line:#2B2B2B;
  --green:#FFFFFF; --green-soft:#1C1C1C; --brass:#3FDCFF; --flag:#FF7A6B; --flag-soft:#3A1512;
  --on-green:#000000;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 64px}
header.bar{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:40px}
.mark{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.bar small{color:var(--muted);font-size:14px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(40px,7vw,64px);line-height:1.02}
h2{font-size:clamp(26px,4vw,34px);line-height:1.15}
h3{font-size:22px;line-height:1.25}
p{margin:0}
.lede{font-family:var(--serif);font-size:21px;line-height:1.5;color:var(--ink);max-width:36em;margin-top:22px}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
.btn{display:inline-block;background:var(--green);color:var(--on-green);border:0;border-radius:6px;padding:14px 26px;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 5px var(--brass)}

/* The five pillars: the one memorable device */
.pillars{display:flex;align-items:flex-end;gap:clamp(10px,3vw,22px);height:230px;padding:0 4px;border-bottom:6px solid var(--ink);position:relative}
.pillars::after{content:"";position:absolute;left:-10px;right:-10px;bottom:-14px;height:6px;background:var(--ink);opacity:.35}
.pillar{flex:1;display:flex;flex-direction:column;align-items:stretch;height:100%;justify-content:flex-end}
.cap{height:10px;margin:0 -6px;background:var(--ink);border-radius:1px}
.shaft{flex:1;position:relative;border-left:1px solid var(--line);border-right:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px);opacity:1}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ink);transform-origin:bottom;transition:height 1.1s cubic-bezier(.2,.7,.2,1)}
.pillar.weak .cap{background:var(--brass)}
.plabels .start{display:block;margin-top:6px;font-size:12px;font-weight:600;color:var(--ink)}
.plabels .start::before{content:"";display:block;width:24px;height:3px;background:var(--brass);margin:0 auto 5px}
.plabels{display:flex;gap:clamp(10px,3vw,22px);margin-top:22px;padding:0 4px}
.plabels div{flex:1;text-align:center;font-size:13px;line-height:1.3;color:var(--muted)}
.plabels b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}

.intro-grid{display:grid;grid-template-columns:1fr;gap:48px;margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:28px 0 32px;color:var(--muted);font-size:15px}
.facts span b{color:var(--ink);font-weight:600}

/* Question screen */
.progress{display:flex;gap:6px;margin-bottom:10px}
.progress div{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:34px}
.qtext{font-family:var(--serif);font-size:clamp(24px,3.6vw,31px);line-height:1.25;font-weight:500;max-width:28em}
.qhint{margin-top:12px;color:var(--muted);font-size:15px;max-width:40em}
.options{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:10px}
.opt{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;cursor:pointer;font-size:16px;line-height:1.45}
.opt:hover{border-color:var(--green)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);margin-top:2px}
.opt[aria-checked="true"]{border-color:var(--green);background:var(--green-soft)}
.opt[aria-checked="true"] .dot{border-color:var(--green);background:radial-gradient(var(--green) 45%,transparent 50%)}
.qnav{display:flex;justify-content:space-between;margin-top:28px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.link:disabled{opacity:.35;cursor:default}

/* Results */
.score-row{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin:10px 0 8px}
.score{font-family:var(--serif);font-size:clamp(88px,16vw,132px);line-height:.85;font-weight:500;letter-spacing:-.03em}
.score small{font-size:.28em;color:var(--muted);letter-spacing:0;margin-left:4px}
.tier{padding-bottom:10px}
.tier h2{font-size:30px}
.tier p{color:var(--muted);max-width:26em;margin-top:6px}
.flagcount{display:inline-block;margin-top:30px;background:var(--flag-soft);color:var(--flag);padding:8px 14px;border-radius:4px;font-weight:600;font-size:15px}
section.block{margin-top:52px}
.gate{margin-top:44px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:4px;padding:28px}
.gate ul{margin:16px 0 22px;padding-left:20px;color:var(--ink)}
.gate li{margin:4px 0}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 0 20px}
.check input{margin-top:4px}
.err{color:var(--flag);font-size:14px;margin-bottom:10px;min-height:1em}
.fine{font-size:13px;color:var(--muted);margin-top:14px}
.flags{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.flags li{border-left:3px solid var(--flag);padding:6px 0 6px 16px}
.plan{display:grid;gap:34px;margin-top:22px}
.plan ol{margin:12px 0 0;padding-left:22px}
.plan li{margin:8px 0;max-width:40em}
.plan .why{color:var(--muted);margin-top:6px;max-width:40em}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.pitch{margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
footer{margin-top:64px;font-size:13px;color:var(--muted)}
.hidden{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn:disabled{opacity:.6;cursor:wait}
@media (min-width:760px){.intro-grid{grid-template-columns:1.25fr 1fr;align-items:end}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="mark" href="/">VC10X</a>
    <small>For family principals and their offices</small>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>Self-reported and indicative. This audit is a starting point for conversations with your family and advisors, not legal, tax or investment advice.</footer>
</div>

<script>
/* ---------- Configuration: edit these before launch ---------- */
// Episodes shown in the full report, keyed by pillar id. Leave arrays empty to hide the section.
// Serverless function that adds the subscriber to beehiiv (see netlify/functions/subscribe.mjs).
const SUBSCRIBE_ENDPOINT = "/api/subscribe";
const EPISODES = { succ:[], gov:[], next:[], inv:[], sec:[] };
// Example entry: { title:"How a third-generation family rebuilt its governance", url:"https://..." }

const PILLARS = [
  {id:"succ", name:"Succession and continuity", short:"Succession",
   why:"If the principal were unavailable tomorrow, this is what decides whether the family keeps operating or freezes.",
   actions:["Sign or update a durable power of attorney, and brief the person you named this quarter.",
            "Build a central register of accounts, entities, advisors and access, held by at least two people.",
            "Book an estate plan review with counsel, and set a rule that every major life event triggers another one."]},
  {id:"gov", name:"Governance", short:"Governance",
   why:"Most families don't lose wealth to bad markets. They lose it to decisions no one had the authority to make, or disputes no one had a way to settle.",
   actions:["Draft a one-page decision rights map: who decides what, and above which amount.",
            "Hold a structured family meeting with a written agenda and minutes, then set the next date before you leave the room.",
            "Agree a dispute process before you need one, including a named independent chair or mediator."]},
  {id:"next", name:"Next-gen readiness", short:"Next gen",
   why:"Heirs who first see the portfolio at the reading of the will inherit assets without the judgement to hold them.",
   actions:["Invite the next generation to observe at least two investment meetings this year.",
            "Set a learning plan covering financial statements, portfolio basics and how the family governs itself.",
            "Write down the criteria for joining the family office, and make not joining an honourable option."]},
  {id:"inv", name:"Investment architecture", short:"Investments",
   why:"Without a written policy, allocation drifts toward whatever the last good pitch was, and concentration builds quietly.",
   actions:["Write an investment policy statement: return target, risk budget, allocation ranges and a liquidity floor.",
            "Map your largest single exposure and agree a timeline for bringing it within your policy range.",
            "Hold enough liquidity to cover family spending plus unfunded fund commitments through a long drawdown."]},
  {id:"sec", name:"Privacy and security", short:"Security",
   why:"Visibility is the risk. The more the public can piece together about the family, the easier it is to target.",
   actions:["Commission a professional digital footprint audit that includes children and household staff.",
            "Background-check household staff and close service providers, and refresh NDAs on a schedule.",
            "Write a one-page incident plan: who calls whom for a breach, an extortion attempt or an emergency abroad."]}
];

const QUESTIONS = [
  {p:"succ", q:"If the principal were incapacitated tomorrow, who has legal authority to make financial decisions?",
   o:["A named person, documented, who has been briefed and knows where everything is","A named person in the documents, but they haven't been briefed","We assume a family member would step in","No one clearly does"],
   flag:"No one has clear legal authority to act if the principal is incapacitated."},
  {p:"succ", q:"When was your estate plan last reviewed with counsel?",
   o:["Within the last two years","Two to five years ago","More than five years ago","We don't have a formal estate plan"],
   flag:"There is no formal estate plan."},
  {p:"succ", q:"Has a successor been agreed for leadership of the family's wealth?",
   o:["Yes, agreed, and the handover is already under way","Someone is identified informally","It has been discussed but not decided","It has never been discussed"],
   flag:"Succession of wealth leadership has never been discussed."},
  {p:"succ", q:"Could someone else reconstruct the family's accounts, entities, advisors and access without the principal?",
   hint:"Think bank relationships, passwords, fund commitments, side letters, safe deposit boxes.",
   o:["Yes, from a documented register that at least two people can access","Partly, some of it is written down","Mostly not, it lives in the principal's head","No, only the principal knows"],
   flag:"Critical knowledge of accounts and advisors sits with one person."},

  {p:"gov", q:"Does the family have a written constitution or charter?",
   o:["Yes, written, agreed by the family and revisited periodically","Yes, but it hasn't been looked at in years","No, but there's a shared understanding","No"]},
  {p:"gov", q:"How are major investment decisions made?",
   o:["By a committee with a documented mandate and limits","By a small group, informally","By the principal alone","It depends, and it's not always clear who decides"]},
  {p:"gov", q:"When family members disagree about money, what happens?",
   o:["There is a formal process, such as a family council or independent chair","A trusted elder or advisor mediates informally","We tend to avoid the conversation","There are disputes that remain unresolved"],
   flag:"The family has unresolved disputes and no process to settle them."},
  {p:"gov", q:"How often does the family meet to discuss the wealth itself?",
   o:["At least twice a year, with an agenda","About once a year","Only when something comes up","Never as a formal meeting"]},

  {p:"next", q:"How involved is the next generation in how the wealth is managed?",
   o:["They sit in on investment meetings regularly","They are briefed occasionally","They know the wealth exists but not how it is run","They have very little awareness"]},
  {p:"next", q:"Is there a structured education path for heirs?",
   hint:"Covering finance, investing, governance and the family's values.",
   o:["Yes, a planned curriculum with milestones","Some courses and ad hoc learning","They are expected to learn on the job","No"]},
  {p:"next", q:"Do heirs have clear paths, whether inside the family office or outside it?",
   o:["Yes, with written criteria for joining and defined roles","It has been discussed","It's assumed they will join","It hasn't been discussed"]},
  {p:"next", q:"How openly has the family discussed the size of the wealth and what heirs should expect?",
   o:["Openly, and in a way suited to each person's age","Partially","We have avoided it","Heirs would likely be surprised"]},

  {p:"inv", q:"Do you have a written investment policy statement with target allocations?",
   o:["Yes, and it is reviewed every year","Yes, but it is out of date","We have informal targets","No"]},
  {p:"inv", q:"How much of total net worth sits in your single largest exposure?",
   hint:"An operating business, one listed stock, or one property portfolio.",
   o:["Less than 20%","20% to 40%","40% to 70%","More than 70%"],
   flag:"More than 70% of net worth sits in a single exposure."},
  {p:"inv", q:"Could the family cover 24 months of spending and capital commitments without selling illiquid assets?",
   o:["Yes, comfortably","Probably","Not sure","No"],
   flag:"The family could not cover two years of needs without selling illiquid assets."},
  {p:"inv", q:"How are fund managers and direct deals evaluated?",
   o:["A documented process, including operational due diligence","Consistently, but not written down","Mostly on relationships and referrals","Mostly on instinct"]},

  {p:"sec", q:"When was the family's digital footprint last audited?",
   hint:"Addresses, children's schools, travel patterns and photos that can be found online.",
   o:["Within the last year, by a professional","We have checked it ourselves","Never, but we are careful","Never"]},
  {p:"sec", q:"Are household staff and close service providers background-checked and under NDA?",
   o:["All of them, refreshed on a schedule","Most of them","Some of them","None"]},
  {p:"sec", q:"Who looks after cyber security for family devices, email and financial accounts?",
   o:["A professional provider manages it","Family members keep good habits on their own","It's inconsistent across the family","No one in particular"],
   flag:"No one is responsible for the family's cyber security."},
  {p:"sec", q:"Is there a written plan for a data breach, an extortion attempt or a medical emergency abroad?",
   o:["Yes, written and rehearsed","Written, not rehearsed","Informal understanding only","No"],
   flag:"There is no plan for a breach, extortion attempt or emergency abroad."}
];

const TIERS = [
  {min:80, name:"Institutional", text:"Strong foundations across the board. Your work now is maintenance, and preparing the next generation to run what you've built."},
  {min:60, name:"Developing", text:"Solid in places, with specific gaps that a single shock would expose. The good news: they are fixable within a year."},
  {min:40, name:"Fragile", text:"Structures exist, but mostly on paper or in one person's head. They would struggle to survive a sudden change."},
  {min:0,  name:"Exposed", text:"Today the family's wealth depends on things going right. A few decisions this quarter would change that."}
];

/* ---------- State ---------- */
const KEY = "vc10x-family-gap-audit";
let S = {stage:"intro", i:0, a:Array(QUESTIONS.length).fill(null), lead:null};
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.a && saved.a.length===QUESTIONS.length) S = saved; } catch(e){}
(function captureUTM(){
  try {
    const q = new URLSearchParams(location.search), u = {};
    ["utm_source","utm_medium","utm_campaign","utm_content"].forEach(k => { if (q.get(k)) u[k] = q.get(k).slice(0,100); });
    if (Object.keys(u).length) S.utm = u;
    if (!S.utm && document.referrer && !document.referrer.includes(location.host)) S.utm = {referrer: document.referrer.slice(0,200)};
  } catch(e){}
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function results(){
  const by = {};
  PILLARS.forEach(p => by[p.id] = {got:0, max:0});
  const flags = [];
  QUESTIONS.forEach((q, k) => {
    const ans = S.a[k]; const pts = ans==null ? 0 : 3 - ans;
    by[q.p].got += pts; by[q.p].max += 3;
    if (q.flag && ans === 3) flags.push(q.flag);
  });
  const pct = {}; let got=0, max=0;
  PILLARS.forEach(p => { pct[p.id] = Math.round(by[p.id].got / by[p.id].max * 100); got += by[p.id].got; max += by[p.id].max; });
  const total = Math.round(got / max * 100);
  const tier = TIERS.find(t => total >= t.min);
  const ranked = [...PILLARS].sort((x,y) => pct[x.id] - pct[y.id]);
  return {pct, total, tier, flags, weakest: ranked.slice(0,2)};
}

function pillarsHTML(pct, {labels=true, mark=[]} = {}){
  const cols = PILLARS.map(p => `
    <div class="pillar ${mark.includes(p.id)?'weak':''}" aria-hidden="true">
      <div class="cap"></div><div class="shaft"><div class="fill" data-h="${pct ? pct[p.id] : 0}"></div></div>
    </div>`).join("");
  const labs = PILLARS.map(p => labels
      ? `<div>${pct ? `<b>${pct[p.id]}%</b>` : ""}${esc(p.short)}${mark.includes(p.id) ? `<span class="start">Start here</span>` : ""}</div>`
      : `<div><b>?</b>Locked</div>`).join("");
  return `<div class="pillars">${cols}</div><div class="plabels">${labs}</div>`;
}
function raise(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".fill").forEach(f => f.style.height = f.dataset.h + "%");
  }));
}

/* ---------- Screens ---------- */
function intro(){
  const started = S.a.some(x => x!=null);
  $app.innerHTML = `
  <div class="intro-grid">
    <div>
      <h1>The Family Gap Audit</h1>
      <p class="lede">Twenty questions on succession, governance, next-gen readiness, investments and security. At the end you get a score, the red flags in your answers, and where to start.</p>
      <div class="facts"><span><b>7 minutes</b> to complete</span><span><b>5 pillars</b> scored</span><span>Answers stay in your browser</span></div>
      <button class="btn" id="go">${started ? "Continue the audit" : "Start the audit"}</button>
      ${started ? `<button class="link" id="reset" style="margin-left:18px">Start over</button>` : ""}
    </div>
    <div>${pillarsHTML(null)}</div>
  </div>`;
  document.getElementById("go").onclick = () => { S.stage="q"; S.i = Math.max(0, S.a.findIndex(x=>x==null)); if (S.i<0) S.i=0; save(); render(); };
  const r = document.getElementById("reset"); if (r) r.onclick = restart;
}

function question(){
  const q = QUESTIONS[S.i], p = PILLARS.find(x => x.id===q.p);
  const bars = PILLARS.map(pl => {
    const idx = QUESTIONS.map((qq,k)=>qq.p===pl.id?k:-1).filter(k=>k>=0);
    const done = idx.filter(k => S.a[k]!=null).length;
    return `<div><i style="width:${done/idx.length*100}%"></i></div>`;
  }).join("");
  $app.innerHTML = `
    <div class="progress" aria-hidden="true">${bars}</div>
    <div class="qmeta"><span>${esc(p.name)}</span><span>Question ${S.i+1} of ${QUESTIONS.length}</span></div>
    <p class="qtext" id="qt">${esc(q.q)}</p>
    ${q.hint ? `<p class="qhint">${esc(q.hint)}</p>` : ""}
    <ul class="options" role="radiogroup" aria-labelledby="qt">
      ${q.o.map((t,k) => `<li><button class="opt" role="radio" aria-checked="${S.a[S.i]===k}" data-k="${k}"><span class="dot"></span><span>${esc(t)}</span></button></li>`).join("")}
    </ul>
    <div class="qnav">
      <button class="link" id="back" ${S.i===0?"disabled":""}>Previous question</button>
      ${S.a[S.i]!=null ? `<button class="link" id="next">${S.i===QUESTIONS.length-1?"See my score":"Next question"}</button>` : ""}
    </div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    S.a[S.i] = +b.dataset.k; save();
    document.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", x===b));
    setTimeout(advance, 260);
  });
  document.getElementById("back").onclick = () => { if (S.i>0){ S.i--; save(); render(); } };
  const n = document.getElementById("next"); if (n) n.onclick = advance;
  const first = document.querySelector('.opt[aria-checked="true"]') || document.querySelector(".opt");
  first && first.focus({preventScroll:true});
}
function advance(){
  if (S.i < QUESTIONS.length-1){ S.i++; }
  else { const m = S.a.findIndex(x=>x==null); if (m>=0){ S.i=m; } else { S.stage = S.lead ? "report" : "teaser"; } }
  save(); render(); window.scrollTo(0,0);
}

function teaser(){
  const R = results();
  $app.innerHTML = `
    <p class="muted">Your family's score</p>
    <div class="score-row">
      <div class="score">${R.total}<small>/100</small></div>
      <div class="tier"><h2>${R.tier.name}</h2><p>${esc(R.tier.text)}</p></div>
    </div>
    ${R.flags.length ? `<span class="flagcount">${R.flags.length} red flag${R.flags.length>1?"s":""} found in your answers</span>` : ""}
    <section class="block">${pillarsHTML(R.pct, {labels:false})}</section>
    <div class="gate">
      <h3>Unlock your full report</h3>
      <ul>
        <li>Your score on each of the five pillars</li>
        <li>${R.flags.length ? "The red flags in your answers, spelled out" : "Where your answers came closest to a red flag"}</li>
        <li>A prioritised action plan for your two weakest pillars</li>
      </ul>
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" tabindex="-1" autocomplete="off"></div>
      <div class="field"><label for="nm">First name</label><input id="nm" autocomplete="given-name"></div>
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
      <div class="field"><label for="rl">You are</label>
        <select id="rl"><option value="">Choose one</option><option>Family principal</option><option>Next-generation family member</option><option>Family office CIO or executive</option><option>Advisor to families</option></select></div>
      <label class="check"><input type="checkbox" id="ok" checked> Send me the VC10X newsletter. Unsubscribe any time.</label>
      <p class="err" id="er" role="alert"></p>
      <button class="btn" id="unlock">Unlock my full report</button>
      <p class="fine">We never share your answers. Your individual responses are not stored on our servers.</p>
    </div>`;
  raise();
  document.getElementById("unlock").onclick = async () => {
    const nm = document.getElementById("nm").value.trim(), em = document.getElementById("em").value.trim(), rl = document.getElementById("rl").value;
    const er = document.getElementById("er"), btn = document.getElementById("unlock");
    if (!nm) { er.textContent = "Add your first name to continue."; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { er.textContent = "Enter a valid email address, like name@family.com."; return; }
    if (!rl) { er.textContent = "Choose the option that describes you best."; return; }
    er.textContent = "";
    const ok = document.getElementById("ok").checked;
    S.lead = {nm, em, rl, ok, t: Date.now()};
    if (ok) {
      btn.disabled = true; btn.textContent = "Unlocking your report";
      const R = results();
      try {
        await fetch(SUBSCRIBE_ENDPOINT, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            form: "family-gap-audit", email: em, firstName: nm, role: rl,
            score: R.total, tier: R.tier.name, weakest: R.weakest[0].short,
            website: document.getElementById("website").value,
            ...(S.utm || {})
          })
        });
      } catch(e) { /* Never block the report on a network error */ }
    }
    S.stage = "report"; save(); render(); window.scrollTo(0,0);
  };
}

function report(){
  const R = results();
  const weakIds = R.weakest.map(p=>p.id);
  const eps = R.weakest.flatMap(p => EPISODES[p.id] || []);
  $app.innerHTML = `
    <p class="muted">Report for ${esc(S.lead.nm)}</p>
    <div class="score-row">
      <div class="score">${R.total}<small>/100</small></div>
      <div class="tier"><h2>${R.tier.name}</h2><p>${esc(R.tier.text)}</p></div>
    </div>
    <section class="block">
      <h3 style="margin-bottom:26px">Your five pillars</h3>
      ${pillarsHTML(R.pct, {mark:weakIds})}
    </section>
    <section class="block">
      <h3>Red flags</h3>
      ${R.flags.length
        ? `<ul class="flags">${R.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`
        : `<p class="muted" style="margin-top:12px">None of your answers hit a critical red flag. Your gaps are about depth, not exposure.</p>`}
    </section>
    <section class="block">
      <h3>Where to start</h3>
      <div class="plan">
        ${R.weakest.map(p => `<div>
          <h2>${esc(p.name)} <span class="muted" style="font-size:.7em">${R.pct[p.id]}%</span></h2>
          <p class="why">${esc(p.why)}</p>
          <ol>${p.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>
        </div>`).join("")}
      </div>
    </section>
    ${eps.length ? `<section class="block"><h3>Recommended listening</h3><ul class="flags">${eps.map(e=>`<li style="border-color:var(--brass)"><a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(e.title)}</a></li>`).join("")}</ul></section>` : ""}
    <section class="block">
      <h3>Take this further</h3>
      <p class="muted" style="margin-top:8px;max-width:36em">The most useful thing you can do next is ask another family member to take the audit on their own, then compare. The gaps between your answers are often bigger than the gaps in them.</p>
      <div class="actions">
        <button class="btn" id="share">Copy the audit link</button>
        <button class="btn ghost" id="again">Retake the audit</button>
      </div>
      <p class="fine" id="copied" role="status"></p>
    </section>
    <div class="pitch">
      <h3>From the VC10X newsletter</h3>
      <p style="margin-top:8px;max-width:36em">How families, CIOs and fund managers actually handle succession, governance and allocation decisions, drawn from 300+ VC10X conversations. ${S.lead.ok ? "You're subscribed as " + esc(S.lead.em) + "." : ""}</p>
    </div>`;
  raise();
  document.getElementById("again").onclick = restart;
  document.getElementById("share").onclick = async () => {
    const msg = document.getElementById("copied");
    try { await navigator.clipboard.writeText(location.href.split("#")[0]); msg.textContent = "Link copied. Send it to a family member."; }
    catch(e){ msg.textContent = "Copy this link: " + location.href.split("#")[0]; }
  };
}

function restart(){ const lead = S.lead; S = {stage:"intro", i:0, a:Array(QUESTIONS.length).fill(null), lead}; save(); render(); }
function render(){ ({intro, q:question, teaser, report})[S.stage](); }
render();
</script>
</body>
</html>
